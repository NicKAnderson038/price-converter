# Deploy the Price Converter PWA to GitHub Pages (blueprint §5).
#
# Least privilege: the default token can only read the repository. Pages write
# access and the OIDC token used to publish are scoped to the deploy job alone.
name: Deploy to GitHub Pages

on:
  # Runs on the repository's default branch.
  push:
    branches: [main]
  # Manual runs from the Actions tab.
  workflow_dispatch:

# Only one Pages deployment at a time; a newer run cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

# Minimum default permissions; the deploy job widens this below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Copy OCR assets
        run: npm run assets:ocr

      - name: Build
        run: npm run build

      - name: Verify production artifact
        run: node scripts/verify-artifact.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Ship public/.nojekyll (a dotfile) so Pages serves dist/ as-is and
          # does not run Jekyll over the built output.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
